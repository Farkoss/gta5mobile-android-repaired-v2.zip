
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Extract project
        run: |
          set -euxo pipefail
          unzip -t gta5mobile-android-repaired-v2.zip
          mkdir -p source
          unzip -q gta5mobile-android-repaired-v2.zip -d source

          ANDROID_DIR="$(dirname "$(find source -path '*/android/build.gradle' -print -quit)")"
          test -n "$ANDROID_DIR"

          ROOT_DIR="$(dirname "$ANDROID_DIR")"
          test -f "$ROOT_DIR/Cargo.toml"
          test -f "$ANDROID_DIR/build.gradle"

          echo "ROOT_DIR=$ROOT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $ROOT_DIR"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build APK
        run: gradle -p "$ROOT_DIR/android" testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: GTA-V-Android-APK
          path: source/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
